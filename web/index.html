  main { max-width: 620px; margin: 0 auto; padding: 20px 16px 72px; min-height: 100%; }

  /* ---------------------------------------------------------- top brand bar */
  .brandbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(145deg, var(--coral), var(--gold));
    color: var(--night-deep); font-weight: 800; font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 14px rgba(242, 121, 92, .35);
  }
  .brand .word { line-height: 1.1; }
  h1 {
    font-size: 1.15rem; margin: 0; letter-spacing: .01em;
    font-weight: 800; color: var(--ink);
  }
  .tag {
    color: var(--muted); margin: 1px 0 0; font-size: .72rem;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .who-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 99px; padding: 7px 8px 7px 14px;
    color: var(--muted); font-size: .82rem;
    backdrop-filter: blur(10px);
  }
  .who-pill strong { color: var(--ink); font-weight: 600; }

  /* ------------------------------------------------------------------ misc */
  select, input[type=email], input[type=password] {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ink);
    background: rgba(8, 12, 22, .55); border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--teal); outline-offset: 2px;
  }
  select option { background: var(--panel-solid); color: var(--ink); }
  label { display: block; font-size: .78rem; color: var(--muted); margin: 12px 0 5px; }
  .row { display: flex; gap: 12px; } .row > * { flex: 1; }
  @media (max-width: 480px) { .row.stack { flex-direction: column; gap: 0; } }

  button {
    font: inherit; padding: 12px 18px; border: 0; border-radius: var(--radius-sm);
    cursor: pointer; font-weight: 700; letter-spacing: .01em;
    background: linear-gradient(120deg, var(--coral), var(--gold));
    color: #241205; box-shadow: 0 4px 18px rgba(242, 121, 92, .28);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(242, 121, 92, .38); }
  button.secondary {
    background: transparent; color: var(--ink); font-weight: 500;
    border: 1px solid var(--line-strong); box-shadow: none;
  }
  button.secondary:hover:not(:disabled) { border-color: var(--teal); transform: none; box-shadow: none; }
  button.link {
    background: none; color: var(--teal); padding: 0; font-weight: 500;
    text-decoration: underline; box-shadow: none;
  }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  /* ------------------------------------------------------------------ card */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .35);
  }
  .card h2 { font-size: 1rem; margin: 0 0 14px; font-weight: 700; }

  .window {
    margin-top: 14px; padding: 10px 12px; border-radius: var(--radius-sm);
    background: rgba(8, 12, 22, .5); border: 1px solid var(--line);
    color: var(--muted); font-size: .87rem;
  }
  .msg { margin-top: 12px; font-size: .87rem; min-height: 1.3em; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }

  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
  dt { color: var(--muted); font-size: .88rem; } dd { margin: 0; }

  .pill {
    display: inline-block; padding: 2px 11px; border-radius: 99px; font-size: .76rem;
    font-weight: 700; letter-spacing: .03em; border: 1px solid var(--line-strong);
    color: var(--teal); background: rgba(71, 224, 210, .10);
  }

  .notice {
    border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 16px; font-size: .93rem;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px);
  }
  .notice.ok   { background: var(--ok-bg);   color: var(--ok);   border-color: rgba(82,224,172,.35); }
  .notice.warn { background: var(--warn-bg); color: var(--warn); border-color: rgba(240,189,99,.35); }

  .proposal { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .proposal h2 { margin-top: 0; }
  .deadline { color: var(--muted); font-size: .87rem; margin-top: 10px; }

  .picker { display: grid; gap: 8px; margin-top: 16px; }
  .picker .opt {
    text-align: left; display: block; width: 100%; background: rgba(8,12,22,.4);
  }
  .picker .opt small { display: block; font-weight: 400; color: var(--muted-dim); margin-top: 2px; }
  .picker p { margin: 0; color: var(--muted); font-size: .87rem; }

  .board-line { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
  .board-line span:first-child { color: var(--muted); font-size: .9rem; }
  #countdown { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--teal); }

  @keyframes flash { from { box-shadow: 0 0 0 2px rgba(71,224,210,.7), 0 12px 34px rgba(0,0,0,.35); } to { box-shadow: 0 12px 34px rgba(0,0,0,.35); } }
  .flash { animation: flash 1.6s ease-out; }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
  .hidden { display: none !important; }

  /* --------------------------------------------------------------- hero card */
  #signin {
    text-align: center; padding: 30px 22px 26px; position: relative; overflow: hidden;
    border-color: rgba(71, 224, 210, .18);
  }
  #signin::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% -10%, rgba(71,224,210,.12), transparent 60%);
  }
  .hero-wordmark {
    position: relative; margin: 4px 0 6px; font-size: 2.6rem; font-weight: 800;
    letter-spacing: .04em; line-height: 1;
    background: linear-gradient(120deg, var(--teal) 15%, var(--blue) 55%, var(--violet) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 34px rgba(71, 224, 210, .25);
  }
  .hero-tagline {
    position: relative; color: var(--muted); font-size: .95rem; margin: 0 auto 22px;
    max-width: 34ch;
  }
  .cedar-badge {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    margin: 0 auto 18px; padding: 5px 13px; border-radius: 99px; font-size: .74rem;
    color: var(--teal); background: rgba(71, 224, 210, .10); border: 1px solid rgba(71,224,210,.3);
  }
  .cedar-badge .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 6px var(--ok);
  }
  #signin label { text-align: left; }
  .hero-fields { position: relative; display: flex; flex-direction: column; text-align: left; }
  .hero-fields button { width: 100%; margin-top: 16px; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <div class="brandbar">
    <div class="brand">
      <div class="mark">E</div>
      <div class="word">
        <h1>Exodus</h1>
        <p class="tag">Cab cluster &middot; IIITB</p>
      </div>
    </div>
    <p class="who-pill hidden" id="who-line">Signed in as <strong id="who"></strong> &middot; <button class="link" id="signout" type="button">Sign out</button></p>
  </div>

  <div class="notice hidden" id="notice" role="status" aria-live="polite"></div>

  <section class="card" id="signin">
    <div class="cedar-badge"><span class="dot"></span> Cedar Guard &middot; @iiitb.ac.in only</div>
    <div class="hero-wordmark">EXODUS</div>
    <p class="hero-tagline">No WhatsApp chaos. Split airport &amp; station cabs with verified campus peers.</p>
    <div class="hero-fields">
      <div class="email-wrap">
        <label for="email">IIITB email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@iiitb.ac.in">
      </div>
      <div class="email-wrap">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button id="signin-btn" type="button">Let's roll &#128663;</button>
    </div>
    <div class="msg" id="signin-msg" role="status"></div>
  </section>

  <section class="card hidden" id="status-card">
    <h2>Your request</h2>
    <dl id="status"></dl>
    <div id="proposal"></div>
  </section>

  <section class="card hidden" id="form-card">
    <h2 id="form-title">Your trip</h2>
    <div class="row stack">
      <div><label for="src">From</label><select id="src"></select></div>
      <div><label for="dst">To</label><select id="dst"></select></div>
    </div>
    <label>Preferred departure</label>
    <div class="row">
      <select id="hour" aria-label="Hour"></select>
      <select id="minute" aria-label="Minute"></select>
    </div>
    <div class="row">
      <div><label for="early">Can leave earlier by</label><select id="early"></select></div>
      <div><label for="late">Can leave later by</label><select id="late"></select></div>
    </div>
    <div class="window" id="window"></div>
    <div class="actions">
      <button id="submit" type="button">Join the pool</button>
      <button id="advise" class="secondary" type="button">Check my chances</button>
    </div>
    <div class="msg" id="advice" role="status" aria-live="polite"></div>
    <div class="msg" id="submit-msg" role="status" aria-live="polite"></div>
  </section>

  <section class="card hidden" id="board-card">
    <h2>Release board</h2>
    <div class="board-line"><span>Next release</span><span id="countdown">&ndash;</span></div>
    <div class="board-line"><span id="pool-label">Waiting to be grouped</span><span id="pool">&ndash;</span></div>
    <div class="board-line"><span>Last release</span><span id="last" style="text-align:right"></span></div>
    <div class="hidden" id="demo-release-wrap">
      <div class="actions"><button id="demo-release" class="secondary" type="button">Run a release now</button></div>
      <div class="msg" id="demo-release-msg" role="status" aria-live="polite"></div>
    </div>
  </section>
</main>

<script>
"use strict";

// API base: override with ?api=http://host:port
const API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:3000";

// ?demo=1 is for recording a demo. Releases normally fire on a timer; this adds a
// button that fires one now, so a take never waits on the clock, and opens the
// form on 7 pm +-15 min instead of 5 pm +-30, the window the demo pool is built around.
const DEMO = new URLSearchParams(location.search).get("demo") === "1";

// Mirrors ROUTES in config.py -- keep in sync.
const LOCATIONS = { COLLEGE: "College", AIRPORT: "Kempegowda International Airport", STATION: "City railway station" };
const DESTINATIONS = { COLLEGE: ["AIRPORT", "STATION"], AIRPORT: ["COLLEGE"], STATION: ["COLLEGE"] };
const MAX_FLEX = 240;

// The value is the REASONS enum string, byte for byte; only the label is friendly.
// A mismatch here fails silently (the server sees an unknown reason and 400s),
// so the strings are not derived or reformatted anywhere.
const DECLINE_REASONS = [
  { reason: "PERSON", label: "Not with one of these people", hint: "You won't be grouped with them again." },
  { reason: "TIME", label: "The time doesn't work for me", hint: "You can widen your window to make a match likelier." },
  { reason: "TOO_FEW", label: "I only want a full cab of three", hint: "We won't offer you a pair." },
  { reason: "PLANS_CHANGED", label: "My plans changed", hint: "This removes your request." },
];

// ---- time boundary: the ONLY place clock time <-> integer minutes converts ----
const toMinutes = (hour, minute) => hour * 60 + minute;
const fromMinutes = (m) => {
  const h = Math.floor(m / 60) % 24, mm = m % 60;
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(mm).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`;
};
// ------------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  n.append(...kids.flat().filter((x) => x != null));
  return n;
};
const store = {
  get() { try { return localStorage.getItem("exodus.email"); } catch { return null; } },
  set(v) { try { localStorage.setItem("exodus.email", v); } catch {} },
  clear() { try { localStorage.removeItem("exodus.email"); } catch {} },
};

let email = null, pollTimer = null, noticeTimer = null;
let clockOffset = 0;               // server time minus local time, seconds
let data = null;                   // last { request, proposal }
let board = null;                  // last /board
let lastKey = null;                // skip re-rendering unchanged data, or polling would wipe an open picker
let flow = { step: null };         // the decline picker: null | reason | person | time | plans
let suppressDissolveNotice = false;

// ---------------------------------------------------------------- helpers

function fill(select, options, selected) {
  select.replaceChildren(...options.map(([value, label]) => {
    const o = document.createElement("option");
    o.value = String(value); o.textContent = label;
    if (String(value) === String(selected)) o.selected = true;
    return o;
  }));
}

async function api(path, options = {}) {
  if (mockMode) return mockApi(path, options);
  const res = await fetch(API + path, {
    ...options,
    headers: { "Content-Type": "application/json", ...(email ? { "X-Student-Email": email } : {}) },
  });
  let body = null;
  try { body = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, body };
}

// ------------------------------------------------------------ demo mode
// A tiny in-page stand-in for the API, so every screen can be clicked
// through with no backend running. Turned on with ?mock=1. Shaped to match exactly what render(),
// renderProposal() and renderBoard() above expect back from the real API.
let mockMode = new URLSearchParams(location.search).get("mock") === "1";
const ok = (body) => ({ ok: true, status: 200, body });
const mock = {
  me: { name: "Demo Student", student_id: "imt2022048" },
  request: null,
  proposal: null,
  last_outcome: null,
  releaseTimer: null,
  tickTimer: null,
  seq: 1,
  board: {
    next_release_at: Math.floor(Date.now() / 1000) + 20,
    routes: {
      COLLEGE_AIRPORT: { pool_size: 5, last_release: { pool_size: 34, groups_of_3: 9, groups_of_2: 2, ungrouped: 3, cabs_saved: 20 } },
      COLLEGE_STATION: { pool_size: 2, last_release: { pool_size: 12, groups_of_3: 3, groups_of_2: 1, ungrouped: 1, cabs_saved: 7 } },
      AIRPORT_COLLEGE: { pool_size: 1, last_release: { pool_size: 18, groups_of_3: 4, groups_of_2: 1, ungrouped: 1, cabs_saved: 10 } },
      STATION_COLLEGE: { pool_size: 0, last_release: null },
    },
  },
};

function mockCompanions() {
  return [
    { student_id: "imt2022017", name: "Riya Sharma", email: "riya.sharma@iiitb.ac.in" },
    { student_id: "mt2023045", name: "Kabir Rao", email: "kabir.rao@iiitb.ac.in" },
  ];
}

function mockFormProposal() {
  if (!mock.request || mock.request.status !== "PENDING") return;
  const pair = mock.request.min_group_size === 2 ? false : Math.random() < 0.3;
  const others = pair ? mockCompanions().slice(0, 1) : mockCompanions();
  mock.request.status = "GROUPED";
  mock.proposal = {
    group_id: `demo-${mock.seq++}`,
    state: "FORMED",
    departure_time: mock.request.p,
    size: others.length + 1,
    others,
    explanation: pair
      ? "Only one other match near this window — a third rider may still join before departure."
      : "Everyone here preferred a departure within 15 minutes of each other on this route.",
    accept_deadline: nowServer() + 240,
    my_response: null,
    accepted: 0,
    reduced: false,
    invited: false,
  };
}

function mockScheduleRelease(delaySeconds) {
  clearTimeout(mock.releaseTimer);
  mock.releaseTimer = setTimeout(mockFormProposal, delaySeconds * 1000);
  mock.board.next_release_at = nowServer() + delaySeconds;
}

function mockRespond(body) {
  const p = mock.proposal;
  if (!p) return { ok: false, status: 409, body: { error: "That proposal is no longer active." } };

  if (body.action === "accept") {
    p.my_response = true;
    p.accepted = p.size;
    p.state = "CONFIRMED";
    mock.request.status = "CONFIRMED";
    if (p.size === 2) { p.open_seat = true; p.seat_offered = false; }
    return ok({ state: p.state });
  }

  mock.last_outcome = { cause: "you_declined" };
  if (body.reason === "PLANS_CHANGED") {
    mock.request = null; mock.proposal = null;
    return ok({});
  }
  if (body.reason === "TIME" && body.payload) {
    if (body.payload.b) mock.request.b = Math.max(mock.request.b, body.payload.b);
    if (body.payload.a) mock.request.a = Math.max(mock.request.a, body.payload.a);
  }
  if (body.reason === "TOO_FEW") mock.request.min_group_size = 3;
  mock.request.status = "PENDING";
  mock.proposal = null;
  mockScheduleRelease(10);
  return ok({ next_release_at: mock.board.next_release_at });
}

function mockApi(path, options = {}) {
  const method = options.method || "GET";
  const body = options.body ? JSON.parse(options.body) : null;

  if (path === "/requests" && method === "POST") {
    mock.request = {
      student_id: mock.me.student_id, route: body.route, p: body.p, b: body.b, a: body.a,
      min_group_size: body.min_group_size || 2, status: "PENDING",
    };
    mock.proposal = null;
    mockScheduleRelease(7);
    return ok({});
  }
  if (path === "/requests/me" && method === "GET")
    return ok({ request: mock.request, proposal: mock.proposal, me: mock.me, last_outcome: mock.last_outcome });
  if (path === "/board" && method === "GET")
    return ok({ ...mock.board, server_time: Math.floor(Date.now() / 1000) });
  if (path === "/advise" && method === "POST")
    return ok({ message: "Requests like this landed in a cab of three within about 10 minutes of the preferred time in the last release." });
  const respondMatch = path.match(/^\/groups\/([^/]+)\/respond$/);
  if (respondMatch && method === "POST") return mockRespond(body);
  return { ok: false, status: 404, body: { error: "Unknown demo endpoint." } };
}

function mockEnter() {
  mockMode = true;
  clearInterval(mock.tickTimer);
  mock.tickTimer = setInterval(() => {
    if (nowServer() >= mock.board.next_release_at && !mock.releaseTimer) mockScheduleRelease(16);
  }, 4000);
  const addr = "demo@iiitb.ac.in";
  store.set(addr);
  enter(addr);
}

function say(id, text, kind) { const e = $(id); e.textContent = text; e.className = "msg" + (kind ? " " + kind : ""); }

function notify(text, kind = "", flash = false) {
  const n = $("notice");
  n.textContent = text; n.className = "notice" + (kind ? " " + kind : "");
  if (flash) { void n.offsetWidth; n.classList.add("flash"); }
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => n.classList.add("hidden"), 20000);
}

const nowServer = () => Math.floor(Date.now() / 1000) + clockOffset;
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const routeParts = (route) => route.split("_");

// -------------------------------------------------------------------- form

function buildForm() {
  fill($("src"), Object.entries(LOCATIONS).filter(([k]) => k in DESTINATIONS), "COLLEGE");
  refreshDestinations();
  fill($("hour"), [...Array(24).keys()].map((h) => [h, fromMinutes(h * 60).replace(":00", "")]), DEMO ? 19 : 17);
  fill($("minute"), [...Array(12).keys()].map((i) => [i * 5, String(i * 5).padStart(2, "0")]), 0);
  const flex = [...Array(36).keys()].map((i) => [(i + 1) * 5, `${(i + 1) * 5} min`]);
  fill($("early"), flex, DEMO ? 15 : 30);
  fill($("late"), flex, DEMO ? 15 : 30);
  updateWindow();
}

function refreshDestinations() {
  const opts = DESTINATIONS[$("src").value].map((k) => [k, LOCATIONS[k]]);
  fill($("dst"), opts, opts[0][0]);
}

function currentValues() {
  return {
    route: `${$("src").value}_${$("dst").value}`,
    p: toMinutes(Number($("hour").value), Number($("minute").value)),
    b: Number($("early").value),
    a: Number($("late").value),
  };
}

function updateWindow() {
  const { p, b, a } = currentValues();
  $("window").textContent =
    `You'd accept any time from ${fromMinutes(p - b + 1440)} to ${fromMinutes(p + a)}, ideally ${fromMinutes(p)}.`;
}

async function submit() {
  $("submit").disabled = true;
  say("submit-msg", "");
  try {
    const { ok, body } = await api("/requests", { method: "POST", body: JSON.stringify(currentValues()) });
    if (ok) { say("submit-msg", "You're in the pool. You'll be grouped at the next release.", "ok"); lastKey = null; poll(); }
    else say("submit-msg", (body && body.error) || "Something went wrong.", "err");
  } catch { say("submit-msg", "Can't reach the server. Is the API running?", "err"); }
  $("submit").disabled = false;
}

// Demo control: fire a release now, and say exactly what came of it.
async function runReleaseNow() {
  $("demo-release").disabled = true;
  say("demo-release-msg", "Running the solver on everyone waiting\u2026");
  try {
    const { ok, status, body } = await api("/internal/release?force=1", { method: "POST" });
    const routes = body && typeof body === "object" ? Object.entries(body) : [];
    const failed = routes.filter(([, r]) => r.status === "error");
    const done = routes.map(([, r]) => r).filter((r) => r.status === "released" && r.stats);
    const students = done.reduce((n, r) => n + r.stats.pool_size, 0);
    const cabs = done.reduce((n, r) => n + r.stats.groups_of_3 + r.stats.groups_of_2 + r.stats.ungrouped, 0);
    if (!ok || failed.length)
      say("demo-release-msg", `The release failed (HTTP ${status})${failed.length ? ": " + failed[0][1].error : ""}`, "err");
    else if (!students) say("demo-release-msg", "Nothing to release: nobody is waiting to be grouped.", "err");
    else say("demo-release-msg", `Released: ${students} students \u2192 ${cabs} cabs.`, "ok");
    lastKey = null; poll();
  } catch { say("demo-release-msg", "Can't reach the server. Is the API running?", "err"); }
  $("demo-release").disabled = false;
}

// What this window is likely to get you, before you commit to it. The answer
// comes from the real solver run on the pool as it stands, so it is an
// estimate of the next release, not a promise.
async function checkChances() {
  $("advise").disabled = true;
  say("advice", "Running the solver on the current pool\u2026");
  try {
    const { ok, body } = await api("/advise", { method: "POST", body: JSON.stringify(currentValues()) });
    say("advice", ok ? body.message : (body && body.error) || "Something went wrong.", ok ? "" : "err");
  } catch { say("advice", "Can't reach the server. Is the API running?", "err"); }
  $("advise").disabled = false;
}

// ------------------------------------------------------------- status card

function row(dl, term, value) {
  dl.append(el("dt", {}, term), el("dd", {}, value));
}

// Names come from the college roster; someone missing from it is known by
// their roll number alone.
function personLabel(o) {
  return o.name ? `${o.name} (${o.student_id})` : o.student_id;
}

function render(next) {
  const key = JSON.stringify(next);
  if (next && next.me && next.me.name) $("who").textContent = `${next.me.name} (${next.me.student_id})`;
  if (key === lastKey) return;
  lastKey = key;

  const prev = data;
  if (prev) detectTransitions(prev, next);
  suppressDissolveNotice = false;
  data = next;

  const r = next.request, p = next.proposal;
  const editable = !r || r.status === "PENDING";
  $("form-card").classList.toggle("hidden", !editable);
  $("form-title").textContent = r ? "Change your trip" : "Your trip";
  $("submit").textContent = r ? "Update my request" : "Join the pool";
  $("status-card").classList.toggle("hidden", !r);
  if (!p || p.state !== "FORMED") flow = { step: null };

  const dl = $("status");
  dl.replaceChildren();
  if (r) {
    const [src, dst] = routeParts(r.route);
    row(dl, "Route", `${LOCATIONS[src]} → ${LOCATIONS[dst]}`);
    row(dl, "Preferred", `${fromMinutes(r.p)} (${r.b} min earlier / ${r.a} min later)`);
    row(dl, "Status", el("span", { class: "pill" }, r.status));
    if (r.status === "SAT_OUT")
      row(dl, "", "Sitting this release out after repeated declines. You'll rejoin automatically at the next one.");
  }
  renderProposal();
  renderBoard();
}

// How long until the next release, as a phrase. The board's countdown ticks
// live; a sentence can't, so it says "about N min".
function nextReleaseWhen(at) {
  if (!at) return "coming up";
  const secs = at - nowServer();
  return secs <= 60 ? "due in under a minute" : `in about ${Math.ceil(secs / 60)} min`;
}

// Someone leaves a cab. What the rest of us are told depends on who we are:
// the one who left, the others in a cab that fell apart, or the two who are
// left as a pair. Every version says when the next release is, because that is
// the wait: a student who doesn't know it just leaves.
function declinedMessage(at) {
  return `You declined. You're back in the pool, and the next release is ${nextReleaseWhen(at)}: ` +
    "that's when you'll be grouped again, so you'll have to wait for it.";
}

function dissolveMessage(outcome, prevProposal) {
  const at = board && board.next_release_at;
  const back = `You're back in the pool. The next release is ${nextReleaseWhen(at)}, and it will group you again.`;
  if (prevProposal && prevProposal.invited) return `That seat offer has expired. ${back}`;
  if (!outcome) return `Your cab was called off. ${back}`;
  if (outcome.cause === "you_declined") return `You declined that cab. ${back}`;
  if (outcome.cause === "timeout") return `Nobody answered in time, so that cab was called off. ${back}`;
  const who = outcome.who ? (outcome.who.name || outcome.who.student_id) : "Someone";
  return `${who} backed out, so that cab was called off. ${back}`;
}

function reducedMessage(p) {
  const who = p.left_by ? (p.left_by.name || p.left_by.student_id) : "Someone";
  return `${who} backed out, so your cab is now a pair, still leaving at ${fromMinutes(p.departure_time)}. ` +
    "Stay together, or split: if you split you both go back to the pool and wait for the next release " +
    `(${nextReleaseWhen(board && board.next_release_at)}).`;
}

function detectTransitions(prev, next) {
  const pp = prev.proposal, np = next.proposal;
  const had = pp && pp.state === "FORMED";
  const has = np && np.state === "FORMED";
  if (has && np.invited && !(pp && pp.invited && pp.group_id === np.group_id)) {
    notify(`A seat has opened in a cab that's already agreed for two people, leaving at ${fromMinutes(np.departure_time)}. ` +
      "Accept it or decline before the deadline.", "ok", true);
  } else if (has && (!had || pp.group_id !== np.group_id)) {
    notify("You've been grouped. Review the proposal and respond before the deadline.", "ok", true);
  } else if (has && had && np.reduced && !pp.reduced) {
    notify(reducedMessage(np), "warn", true);
  } else if (had && !np && next.request && next.request.status === "PENDING" && !suppressDissolveNotice) {
    notify(dissolveMessage(next.last_outcome, pp), "warn");
  } else if (pp && np && pp.state === "CONFIRMED" && np.state === "CONFIRMED"
             && pp.group_id === np.group_id && np.size > pp.size) {
    const joined = np.others.filter((o) => !pp.others.some((x) => x.student_id === o.student_id)).map(personLabel);
    notify(`${joined.join(", ")} joined your cab. It's now a full cab of three, still leaving at ` +
      `${fromMinutes(np.departure_time)}.`, "ok", true);
  }
  const status = (d) => d.request && d.request.status;
  if (status(next) === "CONFIRMED" && status(prev) !== "CONFIRMED") notify("Your cab is confirmed.", "ok", true);
  if (status(next) === "SAT_OUT" && status(prev) !== "SAT_OUT")
    notify("You're sitting this release out after repeated declines. You'll rejoin automatically.", "warn");
}

function renderProposal() {
  const box = $("proposal");
  box.replaceChildren();
  const p = data && data.proposal;
  if (!p) return;

  const confirmed = p.state === "CONFIRMED";
  const dl = el("dl");
  row(dl, "Departs", fromMinutes(p.departure_time));
  row(dl, "Group size", String(p.size));
  if (p.explanation) row(dl, "Why", p.explanation);
  if (p.others && p.others.length)
    row(dl, "Travelling with", p.others.map(personLabel).join(", ")
        + (confirmed ? ` — ${p.others.map((o) => o.email).join(", ")}` : ""));
  if (confirmed && p.size === 2) {
    row(dl, "Third seat", p.seat_offered ? "Offered to someone; waiting for their answer."
      : p.open_seat ? "Open. We'll try to fill it at upcoming releases; your departure time won't change."
      : "Not being filled: this cab leaves too soon for another release to find someone.");
  }
  const heading = confirmed ? "Your cab is confirmed" : p.invited ? "A seat is open in this cab"
    : p.reduced ? "Your cab is now a pair" : "Proposed group";
  box.append(el("div", { class: "proposal" }, el("h2", {}, heading), dl));
  if (confirmed) return;

  const wrap = box.firstChild;
  wrap.append(el("div", { class: "deadline", id: "deadline", "data-at": p.accept_deadline }));
  wrap.append(el("div", { id: "actions" }), el("div", { class: "msg", id: "action-msg", role: "alert" }));
  renderActions(p);
  tickDeadline();
}

// ----------------------------------------------------- accept / decline flow

function renderActions(p) {
  const box = $("actions");
  box.replaceChildren();
  say("action-msg", "");

  if (p.my_response === true) {
    box.append(el("p", {}, `You accepted. Waiting for the others (${p.accepted} of ${p.size} accepted).`));
    return;
  }
  if (flow.step === null) {
    if (p.reduced)
      box.append(el("p", {}, "Stay together and the departure time is locked. If you split, you both go back to the pool " +
        `and wait for the next release (${nextReleaseWhen(board && board.next_release_at)}).`));
    if (p.invited)
      box.append(el("p", {}, "The other two have already agreed to this cab. Taking the seat doesn't change the departure time."));
    box.append(el("div", { class: "actions" },
      el("button", { type: "button", id: "accept", onclick: () => respond({ action: "accept" }) },
        p.invited ? "Take this seat" : p.reduced ? "Stay as a pair" : "Accept"),
      el("button", { type: "button", class: "secondary", id: "decline", onclick: () => setFlow("reason") },
        p.invited ? "No thanks…" : p.reduced ? "Split…" : "Decline…")));
    return;
  }

  const back = (to) => el("button", { type: "button", class: "secondary", onclick: () => setFlow(to) }, "Back");
  const picker = el("div", { class: "picker" });

  if (flow.step === "reason") {
    picker.append(el("p", {}, `Why are you ${p.reduced ? "splitting" : "declining"}? Your answer helps the next release get it right.`));
    for (const r of DECLINE_REASONS) {
      picker.append(el("button", { type: "button", class: "secondary opt", "data-reason": r.reason,
        onclick: () => chooseReason(r.reason) }, r.label, el("small", {}, r.hint)));
    }
    picker.append(el("div", { class: "actions" }, back(null)));
  } else if (flow.step === "person") {
    picker.append(el("p", {}, "Who? You won't be grouped with them again."));
    for (const other of p.others) {
      picker.append(el("button", { type: "button", class: "secondary opt", "data-student": other.student_id,
        onclick: () => respond({ action: "decline", reason: "PERSON", payload: { named_student_id: other.student_id } }) },
        personLabel(other)));
    }
    picker.append(el("div", { class: "actions" }, back("reason")));
  } else if (flow.step === "time") {
    const r = data.request;
    const range = (from) => { const o = []; for (let v = from; v <= MAX_FLEX; v += 5) o.push([v, `${v} min`]); return o; };
    const early = el("select", { id: "w-early", "aria-label": "Earlier by" });
    const late = el("select", { id: "w-late", "aria-label": "Later by" });
    fill(early, range(r.b), Math.min(r.b + 15, MAX_FLEX));
    fill(late, range(r.a), Math.min(r.a + 15, MAX_FLEX));
    picker.append(
      el("p", {}, "Widening your window makes a match likelier. You can only widen it, never narrow it."),
      el("div", { class: "row" }, el("div", {}, el("label", { for: "w-early" }, "Earlier by"), early),
        el("div", {}, el("label", { for: "w-late" }, "Later by"), late)),
      el("div", { class: "actions" },
        el("button", { type: "button", id: "widen", onclick: () =>
          respond({ action: "decline", reason: "TIME", payload: { b: Number(early.value), a: Number(late.value) } }) },
          "Decline & widen my window"),
        el("button", { type: "button", class: "secondary", id: "keep", onclick: () =>
          respond({ action: "decline", reason: "TIME" }) }, "Decline, keep my window"),
        back("reason")));
  } else if (flow.step === "plans") {
    picker.append(el("p", {}, "This removes your request from the pool. Continue?"),
      el("div", { class: "actions" },
        el("button", { type: "button", id: "confirm-plans", onclick: () =>
          respond({ action: "decline", reason: "PLANS_CHANGED" }) }, "Yes, remove my request"),
        back("reason")));
  }
  box.append(picker);
  const first = box.querySelector("button, select");
  if (first) first.focus();
}

function setFlow(step) { flow = { step }; renderActions(data.proposal); }

function chooseReason(reason) {
  if (reason === "TOO_FEW") return respond({ action: "decline", reason: "TOO_FEW" });
  setFlow({ PERSON: "person", TIME: "time", PLANS_CHANGED: "plans" }[reason]);
}

async function respond(body) {
  const p = data.proposal;
  document.querySelectorAll("#actions button").forEach((b) => (b.disabled = true));
  try {
    const { ok, body: res } = await api(`/groups/${encodeURIComponent(p.group_id)}/respond`,
      { method: "POST", body: JSON.stringify(body) });
    if (!ok) {
      say("action-msg", (res && res.error) || "Something went wrong.", "err");
      document.querySelectorAll("#actions button").forEach((b) => (b.disabled = false));
      return;
    }
    flow = { step: null };
    if (body.action === "accept") {
      notify(res.state === "CONFIRMED" ? "Your cab is confirmed." : "You accepted. Waiting for the others.", "ok", true);
    } else {
      suppressDissolveNotice = true;
      notify(body.reason === "PLANS_CHANGED" ? "Your request was removed." : declinedMessage(res.next_release_at), "warn");
    }
    lastKey = null;
    await poll();
  } catch {
    say("action-msg", "Can't reach the server. Try again.", "err");
    document.querySelectorAll("#actions button").forEach((b) => (b.disabled = false));
  }
}

// ------------------------------------------------------------------- board

const count = (k, one, many) => `${k} ${k === 1 ? one : many}`;

function lastReleaseText(r) {
  const parts = [];
  if (r.groups_of_3) parts.push(`${count(r.groups_of_3, "cab", "cabs")} of three`);
  if (r.groups_of_2) parts.push(`${count(r.groups_of_2, "cab", "cabs")} of two`);
  if (r.ungrouped) parts.push(`${r.ungrouped} left alone`);
  return `${count(r.pool_size, "student", "students")} → ${parts.join(", ") || "no groups"} · ${count(r.cabs_saved, "cab", "cabs")} saved`;
}

function renderBoard() {
  $("board-card").classList.toggle("hidden", !board);
  if (!board) return;
  const route = data && data.request ? data.request.route
    : !$("form-card").classList.contains("hidden") ? currentValues().route : null;

  let waiting, last;
  if (route) {
    const [src, dst] = routeParts(route);
    $("pool-label").textContent = `Waiting, ${LOCATIONS[src]} → ${LOCATIONS[dst]}`;
    waiting = board.routes[route].pool_size;
    last = board.routes[route].last_release;
  } else {
    $("pool-label").textContent = "Waiting to be grouped";
    waiting = Object.values(board.routes).reduce((s, r) => s + r.pool_size, 0);
    last = null;
  }
  $("pool").textContent = String(waiting);
  $("last").textContent = last ? lastReleaseText(last) : "nothing grouped on this route yet";
}

function tickBoard() {
  if (!board) return;
  if (!board.next_release_at) { $("countdown").textContent = "waiting for the first release"; return; }
  const left = board.next_release_at - nowServer();
  $("countdown").textContent = left > 0 ? mmss(left) : "due any moment";
}

function tickDeadline() {
  const d = $("deadline");
  if (!d) return;
  const left = Number(d.dataset.at) - nowServer();
  d.textContent = left > 0 ? `Respond within ${mmss(left)}` : "The deadline has passed; this group is about to be dissolved.";
}

// ---------------------------------------------------------------- polling

async function poll() {
  if (!email) return;
  try {
    const [me, b] = await Promise.all([api("/requests/me"), api("/board")]);
    if (b.ok) {
      clockOffset = b.body.server_time - Math.floor(Date.now() / 1000);
      // a new run row moves next_release_at: make the release visible, not a dead ten seconds
      if (board && b.body.next_release_at && b.body.next_release_at !== board.next_release_at) {
        const card = $("board-card");
        card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
      }
      board = b.body;
      tickBoard();  // don't leave the placeholder up until the next 1s tick
    }
    if (me.ok) { lastKey === JSON.stringify(me.body) ? renderBoard() : render(me.body); }
    else renderBoard();
  } catch { /* transient; the next tick retries */ }
}

function enter(addr) {
  email = addr;
  $("signin").classList.add("hidden");
  $("who").textContent = addr;  // replaced by the roster name once /requests/me answers
  $("who-line").classList.remove("hidden");
  buildForm();
  $("form-card").classList.remove("hidden");
  poll();
  pollTimer = setInterval(poll, 3000);
}

function leave() {
  $("password").value = "";
  clearInterval(pollTimer); store.clear(); email = null; data = null; board = null; lastKey = null; flow = { step: null };
  if (mockMode) {
    clearTimeout(mock.releaseTimer); clearInterval(mock.tickTimer);
    mock.request = null; mock.proposal = null; mock.last_outcome = null; mockMode = false;
  }
  for (const id of ["form-card", "status-card", "board-card", "who-line", "notice"]) $(id).classList.add("hidden");
  $("signin").classList.remove("hidden");
}

$("signin-btn").addEventListener("click", () => {
  const v = $("email").value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return say("signin-msg", "Enter a valid email address.", "err");
  // Front-end only: any password is accepted. It is not stored, not sent, and cleared once used.
  if (!$("password").value) return say("signin-msg", "Enter your password.", "err");
  $("password").value = "";
  store.set(v); enter(v);
});
$("signout").addEventListener("click", leave);
["src", "dst", "hour", "minute", "early", "late"].forEach((id) =>
  $(id).addEventListener("change", () => { if (id === "src") refreshDestinations(); updateWindow(); renderBoard(); }));
$("submit").addEventListener("click", submit);
$("advise").addEventListener("click", checkChances);
if (DEMO) { $("demo-release-wrap").classList.remove("hidden"); $("demo-release").addEventListener("click", runReleaseNow); }

setInterval(() => { tickBoard(); tickDeadline(); }, 1000);
if (mockMode) {
  mockEnter();
} else {
  const saved = store.get();
  if (saved) enter(saved);
}
</script>
</body>
